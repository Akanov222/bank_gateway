databaseChangelog:
  - changeSet:
      id: 1
      author: IvanDev
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: account_id
                  type: VARCHAR(255) DEFAULT gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255) DEFAULT gen_random_uuid()
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false